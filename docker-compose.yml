# Деплой в Coolify. База данных внешняя: PostgreSQL, заведённый
# в Coolify, приложение живёт в нём отдельной схемой. Поэтому здесь
# только приложение; параметры подключения приходят окружением.
#
# Для локальной разработки база поднимается отдельно: npm run db:up

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:?нужен PUBLIC_URL}

      # Внутренний адрес PostgreSQL в сети Coolify
      DB_HOST: ${DB_HOST:?нужен DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?нужен DB_NAME}
      DB_USER: ${DB_USER:?нужен DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD}
      # Своя схема: база делится с другим проектом
      DB_SCHEMA: ${DB_SCHEMA:-padali}

      SESSION_SECRET: ${SESSION_SECRET:?нужен SESSION_SECRET}

      # Первый администратор: создаётся, пока таблица admin_users пуста
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      UPLOAD_DIR: /app/data/uploads
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}

      # Сколько прокси стоит перед приложением. От этого зависит,
      # чей адрес считается адресом посетителя: ошибёшься в большую
      # сторону — подделают, в меньшую — все попытки входа сложатся
      # в одну. За Traefik в Coolify это один.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

      # Ещё администраторы, через запятую: почта:пароль. Заводятся,
      # пока таблица admin_users пуста.
      ADMIN_USERS: ${ADMIN_USERS:-}

      # Сколько дней держим обезличенную статистику.
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}

      # Мастер-копия снимка: предел ширины и качество webp.
      MASTER_MAX_WIDTH: ${MASTER_MAX_WIDTH:-2560}
      MASTER_QUALITY: ${MASTER_QUALITY:-90}

      # Перевод полей админки. Без ключа кнопки просто не
      # показываются, поэтому переменная необязательная.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-20000}

      # Почта для форм на сайте. Без SMTP_HOST сообщения просто
      # копятся в админке, форма при этом работает.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-padaliband@gmail.com}
      # Мёртвый SMTP не должен держать посетителя у формы минутами.
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-8000}

    volumes:
      # Загруженные изображения. В Coolify сюда монтируется persistent
      # storage: без него фотографии пропадут при следующем деплое.
      - uploads:/app/data/uploads

    # Порт не публикуется на хост: обратный прокси Coolify ходит
    # в контейнер по внутренней сети Docker.
    expose:
      - "3000"

    networks:
      - default
      # Общая сеть Coolify: в ней живут прокси и managed-база,
      # по ней приложение резолвит DB_HOST по имени сервиса.
      - coolify

volumes:
  uploads:

networks:
  coolify:
    external: true
