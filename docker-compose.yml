services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?нужен DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-padali}
      MYSQL_USER: ${DB_USER:-padali}
      MYSQL_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-padali}
      DB_USER: ${DB_USER:-padali}
      DB_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?нужен SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db_data:
  uploads:
